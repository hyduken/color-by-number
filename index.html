<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faf7ef" />
    <meta
      name="description"
      content="Turn your pictures into little color-by-number adventures. Private, playful, and made right in your browser."
    />
    <title>Color by Number</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#/" aria-label="Color by Number home"
        ><span class="brand-mark" aria-hidden="true"
          ><i></i><i></i><i></i><i></i></span
        ><span>color<span class="brand-small">by number</span></span></a
      >
      <a id="library-link" class="button subtle" href="#/library">
        My puzzles <span aria-hidden="true">↗</span>
      </a>
    </header>
    <main id="app"></main>
    <div
      id="notice"
      class="notice"
      role="status"
      aria-live="polite"
      hidden
    ></div>
    <span
      id="announcement"
      class="sr-only"
      role="status"
      aria-live="polite"
    ></span>
    <dialog id="confirm-dialog">
      <form method="dialog">
        <h2 id="confirm-title">Start again?</h2>
        <p id="confirm-copy"></p>
        <div class="dialog-actions">
          <button class="button secondary" value="cancel" autofocus>
            Keep it</button
          ><button class="button primary" value="confirm">Yes, go ahead</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
